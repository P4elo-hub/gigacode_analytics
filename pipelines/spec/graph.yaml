# Spec pipeline topology (SIHIST). Compile: scripts/pipeline_compile.py
# Phase 12: analyze-routing is a graph node. After mutating steps the router
# refreshes JSON (stale_vs), then dispatch picks the next domain step.
# See pipelines/spec/routing_conditions.yaml when_to_run_analyzer.
label: Spec pipeline (SIHIST)
orchestrator: spec-orchestrator
nodes:
  - id: spec-orchestrator
    label: spec-orchestrator
    kind: orchestrator
  - id: find-context
    label: find-context
    subagent: context-researcher
    kind: step
  - id: write-feature
    label: write-feature
    subagent: spec-writer
    kind: step
  - id: analyze-routing
    label: analyze-routing
    subagent: routing-analyzer
    kind: step
  - id: check-feature
    label: check-feature
    subagent: spec-reviewer
    kind: step
  - id: resolve-gaps
    label: resolve-gaps
    subagent: gap-resolver
    kind: step
  - id: challenge-feature
    label: challenge-feature
    subagent: spec-challenger
    kind: step
  - id: resolve-challenges
    label: resolve-challenges
    subagent: challenge-resolver
    kind: step
  - id: check-feature-code
    label: check-feature-code
    subagent: code-auditor
    kind: step
  - id: resolve-code-alignment
    label: resolve-code-alignment
    subagent: alignment-resolver
    kind: step
  - id: archive-session
    label: archive-session
    subagent: null
    kind: meta
  - id: done
    label: PASS
    kind: terminal
edges:
  - id: e-start
    from: spec-orchestrator
    to: find-context
    kind: main
  - id: e-orch-ar
    from: spec-orchestrator
    to: analyze-routing
    kind: branch
    label: routing-state missing/stale
  - id: e-fc-wf
    from: find-context
    to: write-feature
    kind: main
  - id: e-fc-ar
    from: find-context
    to: analyze-routing
    kind: loop
    label: refresh after CONTEXT
  - id: e-wf-cf
    from: write-feature
    to: check-feature
    kind: main
  - id: e-wf-ar
    from: write-feature
    to: analyze-routing
    kind: loop
    label: refresh after SPEC
  - id: e-cf-rg
    from: check-feature
    to: resolve-gaps
    kind: branch
    label: gaps open
  - id: e-cf-rc
    from: check-feature
    to: resolve-challenges
    kind: branch
    label: DECISIONS CH pending
  - id: e-cf-ra
    from: check-feature
    to: resolve-code-alignment
    kind: branch
    label: alignment findings
  - id: e-cf-ch
    from: check-feature
    to: challenge-feature
    kind: branch
    label: no CHALLENGES yet
  - id: e-cf-ar
    from: check-feature
    to: analyze-routing
    kind: loop
    label: refresh after mutate
  - id: e-rg-cf
    from: resolve-gaps
    to: check-feature
    kind: loop
    label: re-check
  - id: e-rg-rc
    from: resolve-gaps
    to: resolve-challenges
    kind: branch
    label: DECISIONS CH batch
  - id: e-rg-ra
    from: resolve-gaps
    to: resolve-code-alignment
    kind: branch
    label: alignment after gaps
  - id: e-rg-ar
    from: resolve-gaps
    to: analyze-routing
    kind: loop
    label: refresh after mutate
  - id: e-cf-cc
    from: check-feature
    to: check-feature-code
    kind: main
    label: after gaps/ch
  - id: e-ch-rc
    from: challenge-feature
    to: resolve-challenges
    kind: main
  - id: e-ch-ar
    from: challenge-feature
    to: analyze-routing
    kind: loop
    label: refresh after mutate
  - id: e-rc-cf
    from: resolve-challenges
    to: check-feature
    kind: loop
  - id: e-rc-ar
    from: resolve-challenges
    to: analyze-routing
    kind: loop
    label: refresh after mutate
  - id: e-cc-cf
    from: check-feature-code
    to: check-feature
    kind: loop
    label: spec edited after audit
  - id: e-cc-rg
    from: check-feature-code
    to: resolve-gaps
    kind: branch
    label: new GAP after audit
  - id: e-cc-ra
    from: check-feature-code
    to: resolve-code-alignment
    kind: branch
    label: alignment gaps
  - id: e-cc-ar
    from: check-feature-code
    to: analyze-routing
    kind: loop
    label: refresh after mutate
  - id: e-ra-cc
    from: resolve-code-alignment
    to: check-feature-code
    kind: loop
    label: re-audit
  - id: e-ra-cf
    from: resolve-code-alignment
    to: check-feature
    kind: loop
    label: SPEC edited per alignment
  - id: e-ra-ar
    from: resolve-code-alignment
    to: analyze-routing
    kind: loop
    label: refresh after mutate
  - id: e-ar-fc
    from: analyze-routing
    to: find-context
    kind: branch
    label: next by dispatch
  - id: e-ar-wf
    from: analyze-routing
    to: write-feature
    kind: branch
    label: next by dispatch
  - id: e-ar-cf
    from: analyze-routing
    to: check-feature
    kind: main
    label: next by dispatch
  - id: e-ar-rg
    from: analyze-routing
    to: resolve-gaps
    kind: branch
    label: next by dispatch
  - id: e-ar-ch
    from: analyze-routing
    to: challenge-feature
    kind: branch
    label: next by dispatch
  - id: e-ar-rc
    from: analyze-routing
    to: resolve-challenges
    kind: branch
    label: next by dispatch
  - id: e-ar-cc
    from: analyze-routing
    to: check-feature-code
    kind: branch
    label: next by dispatch
  - id: e-ar-ra
    from: analyze-routing
    to: resolve-code-alignment
    kind: branch
    label: next by dispatch
  - id: e-ar-done
    from: analyze-routing
    to: done
    kind: branch
    label: ready
  - id: e-cc-done
    from: check-feature-code
    to: done
    kind: main
    label: PASS
