# Routing-state POC (Phase 10). Analyzer writes JSON; router reads overlay.
# Spec collectors unchanged. Cutover: Phase 11–12.
schema_version: 1
artifact:
  id: routing_state
  path: Feature-writing/{task_id}/{task_id}-routing-state.json
analyzer:
  step: analyze-routing
  subagent: routing-analyzer
status_fields:
  open_gaps:
    source: fields.open_gaps
    predicates: [open_gaps]
when:
  - routing_state_needs_refresh
  - open_gaps
  - routing_state_ready
stale_vs:
  - spec
validate_ids:
  - routing-state-missing
  - routing-state-stale
