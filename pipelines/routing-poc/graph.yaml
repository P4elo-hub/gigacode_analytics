# Phase 10 POC: analyzer step writes routing-state JSON; dispatch reads overlay.
label: Routing-state POC
orchestrator: routing-poc-orchestrator
nodes:
  - id: routing-poc-orchestrator
    label: routing-poc-orchestrator
    kind: orchestrator
  - id: analyze-routing
    label: analyze-routing
    subagent: routing-analyzer
    kind: step
  - id: resolve-gaps
    label: resolve-gaps
    subagent: gap-resolver
    kind: step
  - id: done
    label: ready
    kind: terminal
edges:
  - id: r-start
    from: routing-poc-orchestrator
    to: analyze-routing
    kind: main
  - id: r-ar-rg
    from: analyze-routing
    to: resolve-gaps
    kind: branch
    label: open_gaps from JSON
  - id: r-ar-done
    from: analyze-routing
    to: done
    kind: main
    label: routing-state ready
  - id: r-rg-ar
    from: resolve-gaps
    to: analyze-routing
    kind: loop
    label: refresh after mutate
  - id: r-rg-done
    from: resolve-gaps
    to: done
    kind: main
