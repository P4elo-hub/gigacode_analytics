    kind: main
    condition: package_change_lyrics
    label: CHANGE_LYRICS
  - id: e-capture-package_change_production
    from: capture-knowledge
    to: sound-design
    kind: main
    condition: package_change_production
    label: CHANGE_PRODUCTION
  - id: e-capture-base_select
    from: capture-knowledge
