label: spec-v2 pipeline
orchestrator: spec-v2-orchestrator
nodes:
  - id: spec-v2-orchestrator
    label: spec-orchestrator-v2
    kind: orchestrator
  - id: analyze-routing
    label: analyze-routing
    kind: analyzer
    subagent: routing-analyzer
  - id: done
    label: done
    kind: terminal
  - id: context-researcher
    label: context-researcher
    kind: step
    subagent: context-researcher
  - id: spec-writer
    label: spec-writer
    kind: step
    subagent: spec-writer
    cycle:
      persistent: true
      assemble: write_feature
      param: block_id
      folder: "Feature-writing/{slug}"
      out: "{slug}.md"
      item_file: "{slug}.part-{param}.md"
      close: on_done
      calls:
        - agent: spec-writer
          param: goal
          skills:
            - requirements-analysis
          label: Цель и бизнес-требования
          sections:
            - 1.1
        - agent: spec-writer
          param: usecase-as-is
          skills:
            - use-case-analysis
            - uml-diagram-analysis
          label: Use Case AS IS
          sections:
            - 1.2-usecase
            - 1.2-diagram
        - agent: spec-writer
          param: usecase-to-be
          skills:
            - use-case-analysis
            - uml-diagram-analysis
          label: Use Case TO BE
          sections:
            - 1.3-usecase
            - 1.3-diagram
        - agent: spec-writer
          param: constraints
          skills:
            - requirements-analysis
          label: Ограничения и допущения
          sections:
            - 2
        - agent: spec-writer
          param: integration
          skills:
            - integration-analysis
          label: Интеграции и события
          sections:
            - 4.1.1
        - agent: spec-writer
          param: algorithm
          skills:
            - use-case-analysis
          label: Алгоритм обработки
          sections:
            - 4.2.2
        - agent: spec-writer
          param: data-model
          skills:
            - data-model-analysis
          label: Модель данных
          sections:
            - 4.2.3
        - agent: spec-writer
          param: field-mapping
          skills:
            - data-mapping-analysis
          label: Маппинг полей (field lineage)
          sections:
            - 4.2.3-mapping
        - agent: spec-writer
          param: nfr
          skills:
            - nfr-analysis
          label: "НФТ: безопасность, производительность, настройки, тогглы"
          sections:
            - 5.1
            - 5.2-performance
            - 5.2-reliability
            - 5.4
            - 5.5
        - agent: spec-writer
          param: observability
          skills:
            - observability-analysis
          label: Логирование и метрики
          sections:
            - 5.3.1
            - 5.3.2
      ask_queue: true
  - id: gap-resolver
    label: gap-resolver
    kind: step
    subagent: gap-resolver
    ask: true
  - id: spec-reviewer
    label: spec-reviewer
    kind: step
    subagent: spec-reviewer
  - id: code-auditor
    label: code-auditor
    kind: step
    subagent: code-auditor
  - id: alignment-resolver
    label: alignment-resolver
    kind: step
    subagent: alignment-resolver
  - id: spec-challenger
    label: spec-challenger
    kind: step
    subagent: spec-challenger
    ask: true
  - id: challenge-resolver
    label: challenge-resolver
    kind: step
    subagent: challenge-resolver
edges:
  - id: e-orch-ar
    from: spec-v2-orchestrator
    to: analyze-routing
    kind: main
    label: routing-state missing/stale
  - id: e-ar-sw
    from: analyze-routing
    to: spec-writer
    kind: branch
    condition: has_kontekst_uzhe_est_a_feature_writing_slug_slug_md_esh
    condition_label: "контекст уже есть, а Feature-writing/{slug}/{slug}.md ещё нет"
    condition_labels:
      has_kontekst_uzhe_est_a_feature_writing_slug_slug_md_esh: "контекст уже есть, а Feature-writing/{slug}/{slug}.md ещё нет"
  - id: e-ar-gr
    from: analyze-routing
    to: gap-resolver
    kind: branch
    condition: has_v_decisions_est_needs_answer_s_relates_na_gap_open_g
    condition_label: "в DECISIONS есть needs-answer с Relates на GAP, open_gaps не пустые"
    conditions:
      - has_v_decisions_est_needs_answer_s_relates_na_gap_open_g
      - has_resheniya_po_gap_uzhe_est_nuzhno_primenit_v_spec
      - has_open_gaps_ne_pustye_posle_revyu_bez_pending_apply
    condition_labels:
      has_v_decisions_est_needs_answer_s_relates_na_gap_open_g: "в DECISIONS есть needs-answer с Relates на GAP, open_gaps не пустые"
      has_resheniya_po_gap_uzhe_est_nuzhno_primenit_v_spec: решения по GAP уже есть — нужно применить в SPEC
      has_open_gaps_ne_pustye_posle_revyu_bez_pending_apply: open_gaps не пустые (после ревью / без pending-apply)
  - id: e-ar-sr
    from: analyze-routing
    to: spec-reviewer
    kind: branch
    condition: has_spec_est_i_posle_poslednei_pravki_eshche_ne_bylo_usp
    condition_label: "SPEC есть, и после последней правки ещё не было успешного check-feature"
    condition_labels:
      has_spec_est_i_posle_poslednei_pravki_eshche_ne_bylo_usp: "SPEC есть, и после последней правки ещё не было успешного check-feature"
  - id: e-ar-done
    from: analyze-routing
    to: done
    kind: branch
    condition: has_alignment_svezhii_verdict_pass_ili_pass_with_gaps_sp
    condition_label: "ALIGNMENT свежий, verdict PASS или PASS WITH GAPS — spec готов"
    condition_labels:
      has_alignment_svezhii_verdict_pass_ili_pass_with_gaps_sp: "ALIGNMENT свежий, verdict PASS или PASS WITH GAPS — spec готов"
  - id: e-analyze-routing-code-auditor
    from: analyze-routing
    to: code-auditor
    kind: branch
    condition: has_net_otcheta_ili_on_ustarel_korotko_alignment_net_ili
    condition_label: "Нет отчёта или он устарел Коротко: ALIGNMENT нет или старше SPEC Чуть точнее: сверки с кодом ещё не было, или SPEC новее ALIGNMENT"
    conditions:
      - has_net_otcheta_ili_on_ustarel_korotko_alignment_net_ili
      - has_otchet_est_no_bez_pass_korotko_alignment_bez_pass_pa
    condition_labels:
      has_net_otcheta_ili_on_ustarel_korotko_alignment_net_ili: "Нет отчёта или он устарел Коротко: ALIGNMENT нет или старше SPEC Чуть точнее: сверки с кодом ещё не было, или SPEC новее ALIGNMENT"
      has_otchet_est_no_bez_pass_korotko_alignment_bez_pass_pa: "Отчёт есть, но без PASS Коротко: ALIGNMENT без PASS / PASS WITH GAPS Чуть точнее: отчёт есть и не stale, но verdict не PASS — нужен повторный аудит"
  - id: e-analyze-routing-alignment-resolver
    from: analyze-routing
    to: alignment-resolver
    kind: branch
    condition: has_v_alignment_est_critical_major_raskhozhdeniya_otchet
    condition_label: "в ALIGNMENT есть Critical/Major расхождения, отчёт свежий, лимит 3 итераций ещё не исчерпан"
    condition_labels:
      has_v_alignment_est_critical_major_raskhozhdeniya_otchet: "в ALIGNMENT есть Critical/Major расхождения, отчёт свежий, лимит 3 итераций ещё не исчерпан"
  - id: e-alignment-resolver-analyze-routing
    from: alignment-resolver
    to: analyze-routing
    kind: loop
    label: после завершения шага
    after_step: true
  - id: e-analyze-routing-context-researcher
    from: analyze-routing
    to: context-researcher
    kind: branch
    condition: find_context
    condition_label: Не создан файл с описанием контекста по данной задаче или ранее вызванный find-context упал с ошибкой (вебхук не вернул ок)
    condition_labels:
      find_context: Не создан файл с описанием контекста по данной задаче или ранее вызванный find-context упал с ошибкой (вебхук не вернул ок)
  - id: e-context-researcher-analyze-routing
    from: context-researcher
    to: analyze-routing
    kind: loop
    label: после завершения шага
    after_step: true
  - id: e-spec-writer-analyze-routing
    from: spec-writer
    to: analyze-routing
    kind: loop
    label: после завершения шага
    after_step: true
  - id: e-gap-resolver-analyze-routing
    from: gap-resolver
    to: analyze-routing
    kind: loop
    label: после завершения шага
    after_step: true
  - id: e-spec-reviewer-analyze-routing
    from: spec-reviewer
    to: analyze-routing
    kind: loop
    label: после завершения шага
    after_step: true
  - id: e-code-auditor-analyze-routing
    from: code-auditor
    to: analyze-routing
    kind: loop
    label: после завершения шага
    after_step: true
  - id: e-analyze-routing-spec-challenger
    from: analyze-routing
    to: spec-challenger
    kind: branch
    condition: has_faila_slug_challenges_md_eshche_net_gaps_zakryty_che
    condition_label: "файла {slug}-challenges.md ещё нет (gaps закрыты, check-feature уже успешен)"
    condition_labels:
      has_faila_slug_challenges_md_eshche_net_gaps_zakryty_che: "файла {slug}-challenges.md ещё нет (gaps закрыты, check-feature уже успешен)"
  - id: e-spec-challenger-analyze-routing
    from: spec-challenger
    to: analyze-routing
    kind: loop
    label: после завершения шага
    after_step: true
  - id: e-analyze-routing-challenge-resolver
    from: analyze-routing
    to: challenge-resolver
    kind: branch
    condition: has_v_decisions_est_needs_answer_s_relates_na_ch
    condition_label: "в DECISIONS есть needs-answer с Relates на CH-*"
    conditions:
      - has_v_decisions_est_needs_answer_s_relates_na_ch
      - has_resheniya_po_ch_uzhe_est_nuzhno_primenit_v_spec
      - has_est_fail_challenges_i_challenges_open_0
    condition_labels:
      has_v_decisions_est_needs_answer_s_relates_na_ch: "в DECISIONS есть needs-answer с Relates на CH-*"
      has_resheniya_po_ch_uzhe_est_nuzhno_primenit_v_spec: решения по CH уже есть — нужно применить в SPEC
      has_est_fail_challenges_i_challenges_open_0: "есть файл CHALLENGES и challenges.open > 0"
  - id: e-challenge-resolver-analyze-routing
    from: challenge-resolver
    to: analyze-routing
    kind: loop
    label: после завершения шага
    after_step: true
