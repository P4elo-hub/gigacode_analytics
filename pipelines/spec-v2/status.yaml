task_kind: slug
artifacts:
  main:
    path: "{task_id}/main.md"
    exists_as: has_main
    missing_reason: Нет артефакта main — создай файл или поправь status.yaml artifacts.main.path
  routing_state:
    path: "Feature-writing/{task_id}/{task_id}-routing-state.json"
    exists_as: has_routing_state
    missing_reason: нет routing-state.json — нужен analyze-routing
  routing_reports:
    path: "Feature-writing/{task_id}/.pipeline/routing-reports/index.json"
    exists_as: has_routing_reports
collectors:
  - id: routing_state
    source: routing_state
stale:
  - id: routing_state
    when: artifact_older_than
    left: routing_state
    right: routing_reports
orchestrator:
messages:
  ready: spec-v2 ready
  ready_title: spec-v2 — routing-state dispatch
  ready_detail: Delegate выбирает шаг по bool из routing-state.json (pack-local analyzer).
  ready_fix: Оркестратор: delegate → task → append_run_log → ingest → validate.
  stopped: spec-v2 пайплайн остановлен.
collector_mode: routing_state
invariants:
display:
constants:
