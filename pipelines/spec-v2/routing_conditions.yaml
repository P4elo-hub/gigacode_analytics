    type: bool
    instruction: решения по CH уже есть — нужно применить в SPEC
  has_est_fail_challenges_i_challenges_open_0:
    type: bool
    instruction: "есть файл CHALLENGES и challenges.open > 0"
  has_idti_v_check_feature_spec_reviewer_tolko_esli_spec_b:
    type: bool
    instruction: "Идти в check-feature/spec-reviewer только если SPEC был изменен после последнего успешного check-feature внешним шагом.  Не идти в check-feature/spec-reviewer, если последняя правка SPEC была сделана самим check-feature/spec-reviewer в рамках его успешного запуска."
edge_conditions:
  routing_state_needs_refresh:
    expr:
      any:
        - field: has_routing_state
          op: falsy
        - field: stale
          op: contains
          value: routing_state
    dispatch:
      priority: 5
      next: analyze-routing
    label: routing-state missing/stale
    reason: нет routing-state.json — нужен analyze-routing
  not_has_main:
    core: true
    expr:
      field: has_main
      op: falsy
    label: no main
    reason: Нет артефакта main
  find_context:
    expr:
      field: find_context
      op: truthy
    dispatch:
      priority: 110
      next: context-researcher
    label: Не создан файл с описанием контекста по данной задаче или ранее вызванный find-context упал с ошибкой (вебхук не вернул ок)
    reason: Не создан файл с описанием контекста по данной задаче или ранее вызванный find-context упал с ошибкой (вебхук не вернул ок)
