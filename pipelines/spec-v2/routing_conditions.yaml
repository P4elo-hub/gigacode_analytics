    type: bool
    instruction: решения по GAP уже есть — нужно применить в SPEC
  has_open_gaps_ne_pustye_posle_revyu_bez_pending_apply:
    type: bool
    instruction: open_gaps не пустые (после ревью / без pending-apply)
  has_alignment_svezhii_verdict_pass_ili_pass_with_gaps_sp:
    type: bool
    instruction: "ALIGNMENT свежий, verdict PASS или PASS WITH GAPS — spec готов"
  has_net_otcheta_ili_on_ustarel_korotko_alignment_net_ili:
    type: bool
    instruction: "Нет отчёта или он устарел Коротко: ALIGNMENT нет или старше SPEC Чуть точнее: сверки с кодом ещё не было, или SPEC новее ALIGNMENT"
  has_otchet_est_no_bez_pass_korotko_alignment_bez_pass_pa:
    type: bool
    instruction: "Отчёт есть, но без PASS Коротко: ALIGNMENT без PASS / PASS WITH GAPS ( ранее вызывался alignment-resolve, но результат его работы повторно не проверялся)"
  has_v_alignment_est_critical_major_raskhozhdeniya_otchet:
    type: bool
    instruction: "в ALIGNMENT есть Critical/Major расхождения, отчёт свежий, лимит 3 итераций ещё не исчерпан"
  has_faila_slug_challenges_md_eshche_net_gaps_zakryty_che:
    type: bool
    instruction: "файла {slug}-challenges.md ещё нет (gaps закрыты, check-feature уже успешен)"
  has_v_decisions_est_needs_answer_s_relates_na_ch:
    type: bool
    instruction: "в DECISIONS есть needs-answer с Relates на CH-*"
