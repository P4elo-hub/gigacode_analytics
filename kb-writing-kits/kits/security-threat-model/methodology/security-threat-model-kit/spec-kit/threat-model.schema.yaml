artifact: threat-model
description: Contract for current-state functionality security threat model.
language: ru

requiredSections:
  - Контекст threat model
  - Assets и данные
  - Actors и trust boundaries
  - Data flows
  - Threats и mitigations
  - Residual risks
  - Связанные security/NFR/observability артефакты
  - Gaps и допущения

threatTable:
  columns:
    - ID
    - Категория
    - Threat
    - Asset / flow
    - Impact
    - Mitigation
    - Owner
    - Статус

markers:

qualityRules:
  - Trust boundaries are explicit.
  - Every external flow has threat consideration.
  - Every threat has mitigation or residual risk.
  - Security claims are evidence-backed or marked.
