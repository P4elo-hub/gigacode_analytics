artifact: acceptance-tests
description: Contract for acceptance test scenarios.
language: ru

requiredSections:
  - Контекст тестирования
  - Coverage matrix
  - Acceptance scenarios
  - Negative и edge cases
  - Test data
  - Regression scope
  - Gaps и допущения

scenarioTable:
  columns:
    - ID
    - Requirement / Use Case
    - Given
    - When
    - Then
    - Тип
    - Статус

testDataTable:
  columns:
    - Data item
    - Значение / правило
    - Источник
    - Статус

markers:

qualityRules:
  - Every critical requirement has at least one scenario or gap.
  - Scenarios use Given/When/Then.
  - Regression scope is explicit.
