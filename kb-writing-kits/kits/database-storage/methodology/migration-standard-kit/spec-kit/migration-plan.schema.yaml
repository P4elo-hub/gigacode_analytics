artifact: migration-plan
description: Contract for database/data migration plan.
language: ru

requiredSections:
  - Контекст миграции
  - Scope и зависимости
  - Pre-checks
  - План миграции
  - Backfill
  - Validation
  - Риски и ограничения
  - Gaps и допущения

phaseTable:
  columns:
    - Фаза
    - Действие
    - Тип
    - Совместимость
    - Owner
    - Статус

validationTable:
  columns:
    - Проверка
    - Метод
    - Ожидаемый результат
    - Blocking

  columns:
    - Сценарий
    - Потеря данных
    - Ограничения

markers:

qualityRules:
  - Zero-downtime claim requires compatibility strategy.
  - Backfill has batching/idempotency strategy or gap.
