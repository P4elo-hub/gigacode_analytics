<!--
Imported from: nfr-standard-kit/spec-kit\feature-toggles.schema.yaml
Current-state adaptation:
- Use only confirmed current behavior.
- Do not write TO BE, rollout/rollback, future requirements, design proposals, GAP/ASM/DESIGN markers as reader-facing content.
- Put unresolved or future/change-specific material into working-layer gaps, not into permanent KB pages.
-->
artifact: current-state functionality-toggles
description: Contract for current-state functionality toggle documentation.
language: ru
canonicalExample: nfr-standard-kit/examples/account-transfer-current-state functionality-toggles-example.md
sourceStandardSection: "7.5 current-state functionality Toggles"
clarificationPolicyRef: nfr-standard-kit/spec-kit/nfr-clarification.schema.yaml
clarificationBeforeFinalArtifact:
  mandatory: true

documentTitle:
  pattern: "^#### NFR — .+ \\(current-state functionality Toggles\\)$"

requiredSectionsPerToggle:
  - Карточка тогла
  - Поведение при ON/OFF
  - Зависимости
  - План удаления
  - Чек-лист верификации после раскатки

toggleCard:
  columns:
    - Параметр
    - Значение
  requiredRows:
    - Название (ключ)
    - Описание
    - Тип
    - Владелец
    - Дата создания
    - Планируемая дата удаления
    - Значение по умолчанию
    - Стратегия раскатки

toggleTypes:
  - Release toggle
  - Experiment toggle
  - Ops toggle
  - Permission toggle

behaviorTable:
  columns:
    - Состояние
    - Поведение
    - UI
    - API

dependencyTypes:
  - requires
  - conflicts
  - includes

dependenciesTable:
  columns:
    - Тогл
    - Зависит от
    - Тип
    - Описание
    - Статус
  statusColumn:
    required: true
    values:
      - Подтверждено
    rule: >
      Каждая строка зависимости без явного подтверждения пользователя или evidence
  emptyDependenciesRow:
    allowed: true
    note: Строка «конфликтов нет» — только как допущение, если не спрашивалось

gapsAndAssumptions:
  title: Gaps и допущения
  required: true
  columns:
    - ID
    - Тип
    - Где в документе
    - Что предположено / не уточнялось
    - Подтверждено?
    - Как закрыть
  inlineMarkerRule: >
  confirmedMarker: Подтверждено — вы / evidence

removalPlanTable:
  columns:
    - Этап
    - Действие
    - Ответственный
    - Срок

verificationChecklist:
  columns:
    - Метрика
    - Порог (OK → продолжить)
    - Источник
    - Период наблюдения
  note: >

  - Boolean
  - User segment
  - Canary
