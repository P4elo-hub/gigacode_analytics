# Список блоков spec и какой kit их пишет.
# Форма раздела — templates/ и quality-gates/ того kit, не этот файл.
# Скрипты write_feature / section_profiles только читают каталог.
#
# Цифры в profiles (1.1, 4.1.1, …) — это галочки «включить кусок», не заголовки.
# Смысл кода: таблица ниже и поле sections у блока. Имя блока — label.
#
# Как пользоваться:
# - другой вид раздела → templates/ example/ skill/ gate того kit
# - другой набор глав → строка в profiles и/или blocks
# Пути kit от корня kb-writing-kits/.
#
# Коды:
#   1.1               цель
#   1.2-usecase       Use Case AS IS (текст)
#   1.2-diagram       диаграмма  AS IS
#   1.3-usecase       Use Case TO BE (текст)
#   1.3-diagram       диаграмма  TO BE
#   2                 ограничения
#   3.1               архитектура (текст)
#   3.2               sequence-диаграмма
#   4.1.1             синхронный контракт
#   4.1.2             Kafka / события
#   4.2.2             алгоритм
#   4.2.3             модель данных
#   4.2.3-mapping     маппинг полей
#   4.2.3-migration   миграция
#   5.1               безопасность
#   5.2-performance   производительность
#   5.2-reliability   надёжность
#   5.3.1             логи
#   5.3.2             метрики
#   5.4               конфигурация
#   5.5               тогглы
#   5.6-threat        модель угроз
#   6.1-acceptance    приёмка

default_profile: sihist

# Большие главы ## N при сборке. У «2» заголовка нет: его пишет блок constraints.
parent_order:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  - "6"

parent_headers:
  "1": "## 1. Бизнес-требования"
  "3": "## 3. Архитектура"
  "4": "## 4. Функциональные требования"
  "5": "## 5. Нефункциональные требования"
  "6": "## 6. Ссылки и приёмка"

profiles:
  core:
    - "1.1"                 # цель
    - "1.2-usecase"         # UC AS IS
    - "1.3-usecase"         # UC TO BE
    - "2"                   # ограничения
  sihist:
    - "1.1"                 # цель
    - "1.2-usecase"         # UC AS IS
    - "1.2-diagram"         # диаграмма AS IS
    - "1.3-usecase"         # UC TO BE
    - "1.3-diagram"         # диаграмма TO BE
    - "2"                   # ограничения
    - "4.1.1"               # синхронный контракт
    - "4.2.2"               # алгоритм
    - "4.2.3"               # модель данных
    - "4.2.3-mapping"       # маппинг полей
    - "5.1"                 # безопасность
    - "5.2-performance"     # производительность
    - "5.2-reliability"     # надёжность
    - "5.3.1"               # логи
    - "5.3.2"               # метрики
    - "5.4"                 # конфигурация
    - "5.5"                 # тогглы
  full:
    - "1.1"                 # цель
    - "1.2-usecase"         # UC AS IS
    - "1.2-diagram"         # диаграмма  AS IS
    - "1.3-usecase"         # UC TO BE
    - "1.3-diagram"         # диаграмма  TO BE
    - "2"                   # ограничения
    - "3.1"                 # архитектура
    - "3.2"                 # sequence
    - "4.1.1"               # синхронный контракт
    - "4.1.2"               # Kafka / события
    - "4.2.2"               # алгоритм
    - "4.2.3"               # модель данных
    - "4.2.3-mapping"       # маппинг полей
    - "4.2.3-migration"     # миграция
    - "5.1"                 # безопасность
    - "5.2-performance"     # производительность
    - "5.2-reliability"     # надёжность
    - "5.3.1"               # логи
    - "5.3.2"               # метрики
    - "5.4"                 # конфигурация
    - "5.5"                 # тогглы
    - "5.6-threat"          # угрозы
    - "6.1-acceptance"      # приёмка

# Keyword только добавляет раздел к профилю, не собирает ядро.
extra_keywords:
  "3.1":                    # архитектура
    - архитектур
    - микросервис
    - c4
    - контейнер
    - монолит
  "3.2":                    # sequence
    - sequence
    - взаимодейств
    - диаграмма последовательност
  "4.1.2":                  # Kafka / события
    - kafka
    - событие
    - async
    - асинхрон
    - очеред
    - topic
    - rabbit
  "4.2.3-migration":        # миграция
    - миграц
    - liquibase
    - ddl
    - backfill
    - changeset
  "5.6-threat":             # угрозы
    - угроз
    - threat
    - stride
    - threat model
  "6.1-acceptance":         # приёмка
    - приёмк
    - acceptance
    - given/when
    - gherkin

blocks:
  - id: goal
    label: Цель и бизнес-требования
    parent: "1"
    kit: kits/functional-process/methodology/requirements-standard-kit
    sections:
      - "1.1"               # цель
    skills:
      - requirements-analysis
  - id: usecase-as-is
    label: Use Case AS IS
    parent: "1"
    kit: kits/use-case/methodology/use-case-standard-kit
    sections:
      - "1.2-usecase"       # UC AS IS
      - "1.2-diagram"       # диаграмма  AS IS
    skills:
      - use-case-analysis
    section_skills:
      "1.2-diagram":        # диаграмма  AS IS → uml kit
        - uml-diagram-analysis
  - id: usecase-to-be
    label: Use Case TO BE
    parent: "1"
    kit: kits/use-case/methodology/use-case-standard-kit
    sections:
      - "1.3-usecase"       # UC TO BE
      - "1.3-diagram"       # диаграмма  TO BE
    skills:
      - use-case-analysis
    section_skills:
      "1.3-diagram":        # диаграмма  TO BE → uml kit
        - uml-diagram-analysis
  - id: constraints
    label: Ограничения и допущения
    parent: "2"
    kit: kits/functional-process/methodology/requirements-standard-kit
    sections:
      - "2"                 # ограничения
    skills:
      - requirements-analysis
  - id: architecture
    label: Архитектура
    parent: "3"
    kit: kits/architecture/methodology/architecture-standard-kit
    sections:
      - "3.1"               # архитектура
      - "3.2"               # sequence
    skills:
      - architecture-analysis
    section_skills:
      "3.2":                # sequence → uml kit
        - uml-diagram-analysis
  - id: integration
    label: Интеграции и события
    parent: "4"
    kit: kits/integration/methodology/integration-standard-kit
    sections:
      - "4.1.1"             # синхронный контракт
      - "4.1.2"             # Kafka / события
    skills:
      - integration-analysis
  - id: algorithm
    label: Алгоритм обработки
    parent: "4"
    kit: kits/use-case/methodology/use-case-standard-kit
    sections:
      - "4.2.2"             # алгоритм
    skills:
      - use-case-analysis
  - id: data-model
    label: Модель данных
    parent: "4"
    kit: kits/database-storage/methodology/data-standard-kit
    sections:
      - "4.2.3"             # модель данных
    skills:
      - data-model-analysis
  - id: field-mapping
    label: Маппинг полей (field lineage)
    parent: "4"
    kit: kits/field-lineage/methodology/data-mapping-standard-kit
    sections:
      - "4.2.3-mapping"     # маппинг полей
    skills:
      - data-mapping-analysis
  - id: migration
    label: План миграции
    parent: "4"
    kit: kits/migration-liquibase/methodology/migration-standard-kit
    sections:
      - "4.2.3-migration"   # миграция
    skills:
      - migration-analysis
  - id: nfr
    label: "НФТ: безопасность, производительность, настройки, тогглы"
    parent: "5"
    kit: kits/nfr/methodology/nfr-standard-kit
    sections:
      - "5.1"               # безопасность
      - "5.2-performance"   # производительность
      - "5.2-reliability"   # надёжность
      - "5.4"               # конфигурация
      - "5.5"               # тогглы
    skills:
      - nfr-analysis
  - id: observability
    label: Логирование и метрики
    parent: "5"
    kit: kits/observability/methodology/observability-standard-kit
    sections:
      - "5.3.1"             # логи
      - "5.3.2"             # метрики
    skills:
      - observability-analysis
  - id: threat-model
    label: Модель угроз
    parent: "5"
    kit: kits/security-threat-model/methodology/security-threat-model-kit
    sections:
      - "5.6-threat"        # угрозы
    skills:
      - threat-model-analysis
  - id: acceptance
    label: Приёмочные критерии
    parent: "6"
    kit: kits/acceptance-checks/methodology/acceptance-test-standard-kit
    sections:
      - "6.1-acceptance"    # приёмка
    skills:
      - acceptance-test-analysis
