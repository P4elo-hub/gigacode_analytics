# Single source of truth for pipeline topology and step mapping.
# Compile: python3 scripts/pipeline_compile.py --check | --apply

registry:
  step_to_subagent:
    find-context: context-researcher
    check-feature: spec-reviewer
    resolve-gaps: gap-resolver
    challenge-feature: spec-challenger
    resolve-challenges: challenge-resolver
    check-feature-code: code-auditor
    resolve-code-alignment: alignment-resolver
  orchestrator_owned:
    - write-feature
  gated_subagents:
    - context-researcher
    - spec-writer
    - spec-reviewer
    - gap-resolver
    - spec-challenger
    - challenge-resolver
    - code-auditor
    - alignment-resolver
  restartable_steps:
    - find-context
    - write-feature
    - check-feature
    - resolve-gaps
    - challenge-feature
    - resolve-challenges
    - check-feature-code
    - resolve-code-alignment

pipelines:
  spec:
    label: Spec pipeline (SIHIST)
    orchestrator: spec-orchestrator
    nodes:
      - id: spec-orchestrator
        label: spec-orchestrator
        kind: orchestrator
      - id: find-context
        label: find-context
        subagent: context-researcher
        kind: step
      - id: write-feature
        label: write-feature
        subagent: spec-writer
        kind: step
      - id: check-feature
        label: check-feature
        subagent: spec-reviewer
        kind: step
      - id: resolve-gaps
        label: resolve-gaps
        subagent: gap-resolver
        kind: step
      - id: challenge-feature
        label: challenge-feature
        subagent: spec-challenger
        kind: step
      - id: resolve-challenges
        label: resolve-challenges
        subagent: challenge-resolver
        kind: step
      - id: check-feature-code
        label: check-feature-code
        subagent: code-auditor
        kind: step
      - id: resolve-code-alignment
        label: resolve-code-alignment
        subagent: alignment-resolver
        kind: step
      - id: archive-session
        label: archive-session
        subagent: null
        kind: meta
      - id: done
        label: PASS
        kind: terminal
    edges:
      - id: e-start
        from: spec-orchestrator
        to: find-context
        kind: main
      - id: e-fc-wf
        from: find-context
        to: write-feature
        kind: main
      - id: e-wf-cf
        from: write-feature
        to: check-feature
        kind: main
      - id: e-cf-rg
        from: check-feature
        to: resolve-gaps
        kind: branch
        label: gaps open
      - id: e-cf-rc
        from: check-feature
        to: resolve-challenges
        kind: branch
        label: DECISIONS CH pending
      - id: e-cf-ra
        from: check-feature
        to: resolve-code-alignment
        kind: branch
        label: alignment findings
      - id: e-cf-ch
        from: check-feature
        to: challenge-feature
        kind: branch
        label: no CHALLENGES yet
      - id: e-rg-cf
        from: resolve-gaps
        to: check-feature
        kind: loop
        label: re-check
      - id: e-rg-rc
        from: resolve-gaps
        to: resolve-challenges
        kind: branch
        label: DECISIONS CH batch
      - id: e-rg-ra
        from: resolve-gaps
        to: resolve-code-alignment
        kind: branch
        label: alignment after gaps
      - id: e-cf-cc
        from: check-feature
        to: check-feature-code
        kind: main
        label: after gaps/ch
      - id: e-ch-rc
        from: challenge-feature
        to: resolve-challenges
        kind: main
      - id: e-rc-cf
        from: resolve-challenges
        to: check-feature
        kind: loop
      - id: e-cc-cf
        from: check-feature-code
        to: check-feature
        kind: loop
        label: spec edited after audit
      - id: e-cc-rg
        from: check-feature-code
        to: resolve-gaps
        kind: branch
        label: new GAP after audit
      - id: e-cc-ra
        from: check-feature-code
        to: resolve-code-alignment
        kind: branch
        label: alignment gaps
      - id: e-ra-cc
        from: resolve-code-alignment
        to: check-feature-code
        kind: loop
        label: re-audit
      - id: e-ra-cf
        from: resolve-code-alignment
        to: check-feature
        kind: loop
        label: SPEC edited per alignment
      - id: e-cc-done
        from: check-feature-code
        to: done
        kind: main
        label: PASS
  calibration:
    label: Calibration pipeline
    orchestrator: calibration-orchestrator
    nodes:
      - id: calibration-orchestrator
        label: calibration-orchestrator
        kind: orchestrator
      - id: snapshot-baseline
        label: snapshot-baseline
        subagent: null
        kind: step
      - id: capture-review
        label: capture-review
        subagent: review-capturer
        kind: step
      - id: analyze-delta
        label: analyze-delta
        subagent: regression-analyst
        kind: step
      - id: analyze-telemetry
        label: analyze-telemetry
        subagent: session-telemetry-analyst
        kind: step
      - id: propose-calibration
        label: propose-calibration
        subagent: calibration-proposer
        kind: step
      - id: apply-calibration
        label: apply-calibration
        subagent: calibration-applier
        kind: step
      - id: benchmark-rerun
        label: benchmark-rerun
        subagent: benchmark-runner
        kind: step
      - id: cal-done
        label: Scorecard
        kind: terminal
    edges:
      - id: c-start
        from: calibration-orchestrator
        to: snapshot-baseline
        kind: main
      - id: c-sb-cr
        from: snapshot-baseline
        to: capture-review
        kind: main
      - id: c-cr-ad
        from: capture-review
        to: analyze-delta
        kind: main
      - id: c-ad-at
        from: analyze-delta
        to: analyze-telemetry
        kind: main
      - id: c-at-pc
        from: analyze-telemetry
        to: propose-calibration
        kind: main
      - id: c-pc-ac
        from: propose-calibration
        to: apply-calibration
        kind: main
      - id: c-ac-br
        from: apply-calibration
        to: benchmark-rerun
        kind: main
      - id: c-br-done
        from: benchmark-rerun
        to: cal-done
        kind: main

# Declarative dispatch router (phase 2). Evaluated by pipeline_router.py via
# feature_status.choose_next_step() (cutover complete — single routing path).
dispatch:
  spec:
    invariants:
      - id: needs-check-feature
        # After P10–P30 (context/spec); before gaps/challenge/code branches.
        step: check-feature
    rules:
      - priority: 10
        when: alignment_limit_exhausted
        next: null
        outcome: stopped
      - priority: 20
        when: not_has_context
        next: find-context
      - priority: 30
        when: not_has_spec
        next: write-feature
      - priority: 40
        when: needs_answer_with_gaps
        next: resolve-gaps
      - priority: 45
        when: needs_answer_alignment_only
        next: resolve-code-alignment
      - priority: 50
        when: needs_answer_challenges_only
        next: resolve-challenges
      - priority: 60
        when: pending_apply_with_gaps
        next: resolve-gaps
      - priority: 65
        when: pending_apply_alignment_only
        next: resolve-code-alignment
      - priority: 70
        when: pending_apply_challenges_only
        next: resolve-challenges
      - priority: 80
        when: critical_major_mismatch_resolvable
        next: resolve-code-alignment
      - priority: 90
        when: open_gaps
        next: resolve-gaps
      - priority: 100
        when: open_challenges
        next: resolve-challenges
      - priority: 110
        when: no_challenges_file
        next: challenge-feature
      - priority: 120
        when: alignment_missing_or_stale
        next: check-feature-code
      - priority: 130
        when: alignment_pass
        next: null
        outcome: ready
      - priority: 140
        when: alignment_fail_reaudit
        next: check-feature-code
