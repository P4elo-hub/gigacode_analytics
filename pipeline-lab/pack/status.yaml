# Spec-pack status contract. Engine: pipeline_status.populate_status.
# Phase 12: collector_mode routing_state — overlay is the only source of
# domain dispatch fields. Engine still sets exists_as / lines_as / stale[] /
# alignment_stale after overlay.
#   has_context / context_lines                 artifacts.context
#   has_spec / spec_lines                       artifacts.spec
#   has_decisions                               artifacts.decisions
#   has_gaps_map                                artifacts.gaps_map
#   has_challenges                              artifacts.challenges
#   has_challenges_map                          artifacts.challenges_map
#   has_alignment                               artifacts.alignment
#   has_routing_state                           artifacts.routing_state
#   overlay fields                              collectors.routing_state (JSON)
#   stale                                       stale[]
#   alignment_stale                             alignment_stale
#   needs_check_feature / _reason               JSON fields; hook stamp after gate steps
#   step_completion                               JSON metadata (hook; not router overlay)
# Core when names: not_has_<artifact> / {field}_gt_{n} from core_predicates.counters
# Live overlay ALWAYS ON. Missing JSON → P5 analyze-routing (no baseline on live path).
# Stale/invalid JSON → dispatch analyze-routing (P5).
task_kind: slug
collector_mode: routing_state
routing_state_sync:
  skip_after_steps:
    - analyze-routing
  sync_after_steps:
    - check-feature
  invariants:
    needs_check_feature:
      satisfied_by_step: check-feature
constants:
  alignment_max_iterations: 3
  verdict_pass: PASS
  verdict_pass_with_gaps: PASS WITH GAPS
  verdict_fail: FAIL
core_predicates:
  counters:
    - field: decisions_needs_answer
      gt: 0
      alias: field_gt          # legacy catalog name; dispatch uses domain when:
    - field: decisions_pending_apply
      gt: 0
      alias: pending_apply     # same; not a dispatch.yaml when:
artifacts:
  context:
    path: Feature-context/{task_id}.md
    exists_as: has_context
    lines_as: context_lines
    missing_reason: нет проверенного контекста
  spec:
    path: Feature-writing/{task_id}/{task_id}.md
    exists_as: has_spec
    lines_as: spec_lines
    missing_reason: спецификация не написана
  decisions:
    path: Feature-writing/{task_id}/{task_id}-decisions.md
    exists_as: has_decisions
  gaps_map:
    path: Feature-writing/{task_id}/{task_id}-gaps-resolved.md
    exists_as: has_gaps_map
  challenges:
    path: Feature-writing/{task_id}/{task_id}-challenges.md
    exists_as: has_challenges
  challenges_map:
    path: Feature-writing/{task_id}/{task_id}-challenges-resolved.md
    exists_as: has_challenges_map
  alignment:
    path: Feature-writing/{task_id}/{task_id}-code-alignment.md
    exists_as: has_alignment
  routing_state:
    path: Feature-writing/{task_id}/{task_id}-routing-state.json
    exists_as: has_routing_state
    missing_reason: нет routing-state.json — нужен analyze-routing
  routing_reports:
    path: Feature-writing/{task_id}/.pipeline/routing-reports/index.json
    exists_as: has_routing_reports
collectors:
  - id: routing_state
    source: routing_state
stale:
  - id: alignment
    when: artifact_older_than
    left: alignment
    right: spec
  - id: challenges
    when: artifact_older_than
    left: challenges
    right: spec
  - id: context-newer-than-spec
    when: artifact_newer_than
    left: context
    right: spec
  - id: routing_state
    when: artifact_older_than
    left: routing_state
    right: spec
  - id: routing_state
    when: artifact_older_than
    left: routing_state
    right: routing_reports
  - id: routing_state
    when: artifact_older_than
    left: routing_state
    right: context
  - id: routing_state
    when: artifact_older_than
    left: routing_state
    right: decisions
  - id: routing_state
    when: artifact_older_than
    left: routing_state
    right: challenges
  - id: routing_state
    when: artifact_older_than
    left: routing_state
    right: alignment
  - id: routing_state
    when: artifact_older_than
    left: routing_state
    right: gaps_map
  - id: routing_state
    when: artifact_older_than
    left: routing_state
    right: challenges_map
alignment_stale:
  when: artifact_older_than
  left: alignment
  right: spec
  require_left: true
invariants:
  - id: needs-check-feature
    # overlay field; collectors.INVARIANTS is a thin reader (no file parse)
orchestrator:
  write_cycle_step: write-feature
  ask_user_when: decisions_needs_answer
messages:
  ready: Spec готов — финальный ответ пользователю.
  ready_title: Spec готов
  ready_detail: PASS / PASS WITH GAPS
  ready_fix: Финальный ответ пользователю; калибровка — только по запросу.
  stopped: Пайплайн остановлен.
  ask_user: Сейчас НЕ task. Опроси needs-answer → pending-apply → task из JSON ask_user (без delegate). После apply — снова delegate.
  write_cycle: Цикл write-feature (spec-writer по блокам).
display:
  heading: "Фича: {slug}"
  rows:
    - label: CONTEXT_DOC
      exists: has_context
      suffix: "{context_lines} строк"
    - label: SPEC
      exists: has_spec
      suffix: "{spec_lines} строк"
    - label: DECISIONS
      exists: has_decisions
      suffix: "ask {decisions_needs_answer} · apply {decisions_pending_apply}"
    - label: GAPS_MAP
      exists: has_gaps_map
    - label: CHALLENGES
      exists: has_challenges
      suffix: "open {challenges_open}"
    - label: CHALLENGES_MAP
      exists: has_challenges_map
    - label: ALIGNMENT
      exists: has_alignment
      present_format: "✅ итерация {alignment_iteration}/{alignment_max_iterations}"
      absent_format: "❌"
